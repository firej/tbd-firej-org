name: Deploy to tbd.firej.org

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup SSH
        env:
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "tbd.firej.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHER3/rt7Op6zGK2Qtf4rMbxQFRYZJoGi/QhPkz6pzM6" > ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" \
            --exclude='.git' \
            --exclude='bin' \
            --exclude='*.db' \
            --exclude='.idea' \
            --exclude='.vscode' \
            --exclude='design-preview-tbd.firej.org' \
            --exclude='docker-compose.yml' \
            --exclude='.env*' \
            --exclude='.claude' \
            . firej@tbd.firej.org:/opt/tobedone/

          ssh -i ~/.ssh/deploy_key firej@tbd.firej.org '
            cd /opt/tobedone && \
            sudo docker compose -f docker-compose.prod.yml up -d --build --wait --wait-timeout 180 app
          '

      - name: Health check
        run: |
          echo "Waiting for service to start..."
          sleep 5
          for i in 1 2 3 4 5; do
            if curl --connect-timeout 10 --max-time 20 -fsS https://tbd.firej.org/login > /dev/null; then
              echo "✅ Deploy successful!"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 3s..."
            sleep 3
          done
          echo "❌ Health check failed"
          exit 1

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
