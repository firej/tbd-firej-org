# Прод-конфиг — рассчитан на единый /opt/traefik/docker-compose.yml на сервере,
# где уже крутится MariaDB-контейнер и Traefik. Здесь — только наш сервис.
#
# Для деплоя используется make deploy: rsync + docker build + docker compose up
# в /opt/traefik. Этот файл — для справки и для запуска через docker-compose,
# если кто-то захочет поднять стек tbd-firej-org отдельно.

services:
  app:
    build: .
    image: tobedone:latest
    environment:
      - PORT=8080
      - DATABASE_DSN=${DATABASE_DSN}
      - SESSION_SECRET=${SESSION_SECRET}
      - SECURE_COOKIE=true
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tobedone.rule=Host(`tbd.firej.org`)"
      - "traefik.http.routers.tobedone.entrypoints=websecure"
      - "traefik.http.routers.tobedone.tls.certresolver=letsencrypt"
      - "traefik.http.services.tobedone.loadbalancer.server.port=8080"

  # Telegram-бот: без traefik-лейблов — входящего трафика нет.
  # В app при этом нужно прокинуть TELEGRAM_BOT_USERNAME (для deep-link кнопки).
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    image: tobedone-bot:latest
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - MCP_URL=http://app:8080/mcp
      - EXCHANGE_URL=http://app:8080/api/telegram/exchange
      - BOT_DB=/data/bot.sqlite
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - OWNER_CHAT_ID=${OWNER_CHAT_ID}
    volumes:
      - bot_data:/data
    depends_on:
      - app
    restart: unless-stopped

volumes:
  bot_data:
